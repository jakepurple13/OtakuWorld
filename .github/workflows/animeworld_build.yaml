name: AnimeWorld Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      IS_PRERELEASE:
        required: false
        type: boolean
        default: false
      NO_FIREBASE_ONLY:
        description: 'Only build the noFirebase flavor (faster PR checks)'
        required: false
        type: boolean
        default: false

jobs:
  animeworld:
    name: Generate AnimeWorld APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - run: |
          echo $ANIME_GOOGLE_SERVICES_JSON > animeworld/google-services.json
          echo "IS_PRERELEASE=${{ inputs.IS_PRERELEASE }}" >> $GITHUB_ENV
        env:
          ANIME_GOOGLE_SERVICES_JSON: ${{ secrets.ANIME_SERVICES_TWO }}

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set Java Options
        run: echo "JAVA_OPTS=-Xmx4g" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          add-job-summary-as-pr-comment: always

      - name: Set version code
        # Minutes since 2024-01-01 UTC: shared by every workflow and only grows, so a release
        # always installs over an earlier nightly. Read by buildSrc/AppInfo.kt.
        run: echo "OTAKU_VERSION_CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))" >> $GITHUB_ENV

      - name: Build AnimeWorld artifacts
        id: buildAnimeApks
        run: ./gradlew animeworld:${{ inputs.NO_FIREBASE_ONLY && 'assembleNoFirebaseRelease' || 'assembleRelease' }} -PreleaseAbis=arm64-v8a,armeabi-v7a

      - uses: kevin-david/zipalign-sign-android-release@v2.0.2
        name: Sign app APK
        if: ${{ !inputs.NO_FIREBASE_ONLY }}
        id: anime_sign
        with:
          releaseDirectory: animeworld/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - uses: kevin-david/zipalign-sign-android-release@v2.0.2
        name: Sign app APK
        id: anime_sign_no_firebase
        with:
          releaseDirectory: animeworld/build/outputs/apk/noFirebase/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up AnimeWorld artifacts
        run: |
          if [ "${{ inputs.NO_FIREBASE_ONLY }}" != "true" ]; then
            cp ${{ steps.anime_sign.outputs.signedReleaseFile }} animeworld-release.apk
          fi
          cp ${{ steps.anime_sign_no_firebase.outputs.signedReleaseFile }} animeworld-no-firebase-release.apk

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.NO_FIREBASE_ONLY }}
        with:
          name: Signed Anime App
          path: animeworld-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Anime No Firebase App
          path: animeworld-no-firebase-release.apk