name: Minimal Android CI Workflow

on:
  #push:
  #  branches:
  #    - master
  #    - develop
  #  paths-ignore:
  #    - '.github/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - develop
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'misc/**'
  workflow_dispatch:
    inputs:
      build_animeworld:
        description: 'Build AnimeWorld?'
        required: true
        default: 'true'
      build_animeworldtv:
        description: 'Build AnimeWorldTV?'
        required: true
        default: 'true'
      build_mangaworld:
        description: 'Build MangaWorld?'
        required: true
        default: 'true'
      build_novelworld:
        description: 'Build NovelWorld?'
        required: true
        default: 'true'
      build_otakuworld:
        description: 'Build OtakuWorld?'
        required: true
        default: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mangaworld:
    uses: ./.github/workflows/mangaworld_build.yaml
    if: github.event.inputs.build_mangaworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets

  mangaworld_desktop:
    uses: ./.github/workflows/mangaworld_desktop_build.yaml
    if: github.event.inputs.build_mangaworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets
    with:
      ALL_OS: false

  animeworld:
    uses: ./.github/workflows/animeworld_build.yaml
    if: github.event.inputs.build_animeworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets

  animeworld_desktop:
    uses: ./.github/workflows/animeworld_desktop_build.yaml
    if: github.event.inputs.build_animeworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets
    with:
      ALL_OS: false

  #  animeworldtv:
  #    uses: ./.github/workflows/animeworldtv_build.yaml
  #    if: github.event.inputs.build_animeworldtv == 'true' || github.event_name == 'pull_request'
  #    secrets: inherit # pass all secrets

  novelworld:
    uses: ./.github/workflows/novelworld_build.yaml
    if: github.event.inputs.build_novelworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets

  novelworld_desktop:
    uses: ./.github/workflows/novelworld_desktop_build.yaml
    if: github.event.inputs.build_novelworld == 'true' || github.event_name == 'pull_request'
    secrets: inherit # pass all secrets
    with:
      ALL_OS: false

  unit_tests:
    uses: ./.github/workflows/unit_tests.yaml
    if: github.event_name == 'pull_request'
    secrets: inherit # pass all secrets

#  otakuworld:
#    uses: ./.github/workflows/otakuworld_build.yaml
#    if: github.event.inputs.build_otakuworld == 'true' || github.event_name == 'pull_request'
#    secrets: inherit # pass all secrets