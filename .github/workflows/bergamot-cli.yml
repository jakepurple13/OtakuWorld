name: Bergamot CLI

# Builds bergamot-translator's native `translator-cli` (mozilla/translations, inference/) per desktop OS and
# publishes the binaries on a GitHub release. The desktop apps download them on demand with a pinned sha256
# (see kmpuiviews/.../translation/bergamot/BergamotRuntime.kt, `pinnedBergamotCliAssets`).
#
# Not yet proven on CI. Locally (2026-11-06) only the macOS arm64 configuration was built and run, with the same
# flags as the macos-arm64 leg below. macos-x64 and linux-x64 are untested; windows-x64 is expected to fail until
# a BLAS (MKL or OpenBLAS) step is added. The release job publishes whichever legs succeeded.

on:
  # Pushing a bergamot-cli-* tag builds and releases that tag. This works before the workflow reaches the default
  # branch, which workflow_dispatch needs.
  push:
    tags: ['bergamot-cli-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (at this commit) or update; must look like bergamot-cli-1'
        required: true
        type: string

permissions:
  contents: read

env:
  # The pushed tag, or the dispatch input. Validated in both jobs before use.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # mozilla/translations commit whose inference/ is built (BERGAMOT_VERSION v0.6.0).
  TRANSLATIONS_SHA: 8eada038fd45bbf6fa58a412b22f80c79887fabc

jobs:
  build:
    name: Build ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # static: USE_STATIC_LIBS. Linux only; on macOS it makes CMake look for .a files the SDK doesn't ship.
          - { os: macos-latest, key: macos-arm64, arch: armv8-a, static: 'OFF', cxxflags: '-DARM -DFMA -DSSE -flax-vector-conversions -fno-strict-aliasing', exe: translator-cli }
          - { os: macos-15-intel, key: macos-x64, arch: x86-64, static: 'OFF', cxxflags: '', exe: translator-cli }
          - { os: ubuntu-22.04, key: linux-x64, arch: x86-64, static: 'ON', cxxflags: '', exe: translator-cli }
          - { os: windows-latest, key: windows-x64, arch: x86-64, static: 'OFF', cxxflags: '', exe: translator-cli.exe }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: |
          # The app's updater and pre-release list ignore this prefix; anything else could be mistaken for an app release.
          [[ "$TAG" =~ ^bergamot-cli-[0-9A-Za-z.]+$ ]] || { echo "tag must look like bergamot-cli-1"; exit 1; }

      - name: Check out mozilla/translations
        uses: actions/checkout@v7
        with:
          repository: mozilla/translations
          ref: ${{ env.TRANSLATIONS_SHA }}
          path: translations

      - name: Check out the submodules translator-cli needs
        working-directory: translations
        run: |
          git submodule update --init --depth 1 \
            inference/3rd_party/ssplit-cpp \
            inference/marian-fork/src/3rd_party/sentencepiece \
            inference/marian-fork/src/3rd_party/intgemm \
            inference/marian-fork/src/3rd_party/ruy \
            inference/marian-fork/src/3rd_party/simd_utils
          git -C inference/marian-fork/src/3rd_party/ruy submodule update --init --depth 1 third_party/cpuinfo

      # Fixes for current compilers (found building on Apple clang 21 / macOS 26 SDK):
      # zlib's old fdopen macro breaks the SDK's stdio.h, sentencepiece casts -1 to an enum in a constexpr,
      # and marian builds with -Werror, which newer clang warnings (e.g. -Wvla-cxx-extension) trip.
      - name: Patch sources
        working-directory: translations/inference/marian-fork
        run: |
          sed -i.bak 's/^#if defined(MACOS) || defined(TARGET_OS_MAC)$/#if (defined(MACOS) || defined(TARGET_OS_MAC)) \&\& !defined(__APPLE__)/' src/3rd_party/zlib/zutil.h
          sed -i.bak 's/  constexpr unicode_script::ScriptType kAnyType =/  const unicode_script::ScriptType kAnyType =/' src/3rd_party/sentencepiece/src/trainer_interface.cc
          sed -i.bak 's/-Wall; -Werror;/-Wall; -Wno-error;/' CMakeLists.txt

      # x86 marian needs a CPU BLAS (macOS uses Accelerate). Untested: Windows has no BLAS step yet.
      - name: Install BLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: |
          # Bergamot's CMake runs `git submodule update` itself; the checkout above already has what we need.
          cmake -S translations/inference -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOMPILE_CPU=on -DCOMPILE_CUDA=off -DUSE_FBGEMM=off \
            -DBUILD_ARCH=${{ matrix.arch }} \
            -DSSPLIT_USE_INTERNAL_PCRE2=ON \
            -DUSE_STATIC_LIBS=${{ matrix.static }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build --config Release --target translator-cli --parallel 4

      - name: Package
        run: |
          mkdir out
          exe=$(find build -name '${{ matrix.exe }}' -type f | head -n 1)
          cp "$exe" "out/translator-cli-${{ matrix.key }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          if [ "$RUNNER_OS" != "Windows" ]; then strip out/*; fi
          # Stripping drops the arm64 ad-hoc signature, and macOS kills unsigned arm64 binaries; re-sign ad hoc.
          if [ "$RUNNER_OS" = "macOS" ]; then codesign -s - -f out/*; fi
          ls -la out
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd out && $sum -- translator-cli-* | tee ../sha256-${{ matrix.key }}.txt)
          mv sha256-${{ matrix.key }}.txt out/

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bergamot-cli-${{ matrix.key }}
          path: out/*
          if-no-files-found: error

  # Runs even when some legs fail, and publishes only the legs that uploaded an artifact.
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bergamot-cli-*
          merge-multiple: true
          path: assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^bergamot-cli-[0-9A-Za-z.]+$ ]] || { echo "tag must look like bergamot-cli-1"; exit 1; }
          ls assets/sha256-*.txt >/dev/null 2>&1 || { echo "no build leg succeeded"; exit 1; }
          cat assets/sha256-*.txt > assets/SHA256SUMS
          rm assets/sha256-*.txt
          ls -la assets
          # Pre-release and never "Latest": /releases/latest links in the app must keep pointing at app releases.
          # A pushed tag already exists: --verify-tag makes gh fail instead of creating a tag.
          # A dispatch may name a new tag: it is created at the commit this run built from.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${where[@]}" \
              --prerelease --latest=false --title "Bergamot CLI $TAG" \
              --notes "translator-cli from mozilla/translations@${TRANSLATIONS_SHA} (inference/). Used by the desktop apps' offline translation; not an app release."
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
