name: Compose Desktop Build

env:
  GITHUB_DEPLOY: 'false'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      IS_PRERELEASE:
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Package
    timeout-minutes: 15
    continue-on-error: true
    # if: github.event_name  == 'pull_request'

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        jdk: [ 21 ]

    steps:
      - name: Check out the source code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: current
          arguments: ":novelworld:desktop:packageDistributionForCurrentOS"

      - name: Upload ${{ matrix.os }} Build
        uses: actions/upload-artifact@v7
        with:
          name: novelworld-${{ matrix.os }}-build
          path: |
            novelworld/desktop/build/compose/binaries/main/dmg/*.dmg
            novelworld/desktop/build/compose/binaries/main/deb/*.deb
            novelworld/desktop/build/compose/binaries/main/msi/*.msi
