name: Nightly Release Workflow

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at 00:00

  workflow_dispatch:

env:
  IS_PRERELEASE: true

jobs:
  checkNightly:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      shouldRun: ${{ env.NEW_COMMIT_COUNT > 0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to count the commits
      - name: Get new commits
        run: |
          set -x
          echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_ENV
      - name: Set variables.properties
        run: |
          cat <<EOF > variables.properties
          IS_PRERELEASE:true
          EOF

  mangaworld:
    needs: checkNightly
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
    uses: ./.github/workflows/mangaworld_build.yaml
    secrets: inherit # pass all secrets
    with:
      IS_PRERELEASE: true

  # TODO: Will come eventually once everything is migrated
  #  mangaworldDesktop:
  #    needs: checkNightly
  #    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
  #    uses: ./.github/workflows/mangaworld_desktop_build.yaml
  #    secrets: inherit # pass all secrets
  #    with:
  #      IS_PRERELEASE: true

  animeworld:
    needs: checkNightly
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
    uses: ./.github/workflows/animeworld_build.yaml
    secrets: inherit # pass all secrets
    with:
      IS_PRERELEASE: true

  #  animeworldtv:
  #    needs: checkNightly
  #    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
  #    uses: ./.github/workflows/animeworldtv_build.yaml
  #    secrets: inherit # pass all secrets
  #    with:
  #      IS_PRERELEASE: true

  novelworld:
    needs: checkNightly
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
    uses: ./.github/workflows/novelworld_build.yaml
    secrets: inherit # pass all secrets
    with:
      IS_PRERELEASE: true

  desktopVersion:
    name: Compute desktop version
    needs: checkNightly
    continue-on-error: true # failure just skips desktop builds
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to see release tags
      - name: Compute version
        id: version
        run: |
          echo "version=$(bash .github/scripts/desktop-version.sh nightly buildSrc/src/main/kotlin/AppInfo.kt "$(date -u +%Y%m%d%H%M)")" >> "$GITHUB_OUTPUT"

  mangaworldDesktop:
    needs: [ checkNightly, desktopVersion ]
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' && needs.desktopVersion.outputs.version != '' }}
    uses: ./.github/workflows/desktop_release.yaml
    with:
      app: mangaworld
      version: ${{ needs.desktopVersion.outputs.version }}

  animeworldDesktop:
    needs: [ checkNightly, desktopVersion ]
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' && needs.desktopVersion.outputs.version != '' }}
    uses: ./.github/workflows/desktop_release.yaml
    with:
      app: animeworld
      version: ${{ needs.desktopVersion.outputs.version }}

  novelworldDesktop:
    needs: [ checkNightly, desktopVersion ]
    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' && needs.desktopVersion.outputs.version != '' }}
    uses: ./.github/workflows/desktop_release.yaml
    with:
      app: novelworld
      version: ${{ needs.desktopVersion.outputs.version }}

  #  otakuworld:
  #    needs: checkNightly
  #    if: ${{ needs.checkNightly.outputs.shouldRun == 'true' }}
  #    uses: ./.github/workflows/otakuworld_build.yaml
  #    secrets: inherit # pass all secrets
  #    with:
  #      IS_PRERELEASE: true

  release:
    name: Release APK
    needs: [ checkNightly, mangaworld, animeworld, novelworld, mangaworldDesktop, animeworldDesktop, novelworldDesktop ]
    # desktop jobs may fail or be skipped; only the Android builds gate the release
    if: ${{ !cancelled() && needs.checkNightly.outputs.shouldRun == 'true' && needs.mangaworld.result == 'success' && needs.animeworld.result == 'success' && needs.novelworld.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          echo "NIGHTLY_TIME=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "NIGHTLY_TAG=$(date '+%Y_%m_%d')" >> $GITHUB_ENV

      - name: Create Nightly Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail_on_unmatched_files: false # a failed/skipped desktop leg must not block the APKs
          prerelease: true
          generate_release_notes: true
          tag_name: nightly_${{ env.NIGHTLY_TAG }}
          name: OtakuWorld Nightly Release ${{ env.NIGHTLY_TIME }}
          body: Nightly release of OtakuWorld at ${{ env.NIGHTLY_TIME }}
          files: |
            ${{ github.workspace }}/release-artifacts/**/*.apk

      - name: Upload desktop assets
        if: always()
        continue-on-error: true # desktop problems must never block the Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/upload-desktop-assets.sh "nightly_${{ env.NIGHTLY_TAG }}" release-artifacts

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: 'Nightly Release of the project {{ EVENT_PAYLOAD.repository.full_name }} has been deployed at ${{ steps.create_release.outputs.url }}.'
