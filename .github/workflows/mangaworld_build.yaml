name: MangaWorld Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      IS_PRERELEASE:
        required: false
        type: boolean
        default: false

jobs:
  mangaworld:
    name: Generate MangaWorld APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: |
          echo $MANGA_GOOGLE_SERVICES_JSON > mangaworld/google-services.json
          echo "IS_PRERELEASE=${{ inputs.IS_PRERELEASE }}" >> $GITHUB_ENV
        env:
          MANGA_GOOGLE_SERVICES_JSON: ${{ secrets.MANGA_SERVICES_TWO }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 17

      - name: Set Java Options
        run: echo "JAVA_OPTS=-Xmx8g" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary-as-pr-comment: always

      - name: Build MangaWorld artifacts
        id: buildMangaApks
        run: ./gradlew mangaworld:assembleRelease

      - uses: kevin-david/zipalign-sign-android-release@v2.0.2
        name: Sign app APK
        id: manga_sign
        with:
          releaseDirectory: mangaworld/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - uses: kevin-david/zipalign-sign-android-release@v2.0.2
        name: Sign app APK
        id: manga_sign_no_firebase
        with:
          releaseDirectory: mangaworld/build/outputs/apk/noFirebase/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up MangaWorld artifacts
        # ABI splits produce one signed APK per ABI now (instead of a single universal APK),
        # so collect every signedReleaseFileN the action emitted instead of the single-file output.
        run: |
          mkdir -p signed-apks/full signed-apks/noFirebase
          for f in \
            "${{ steps.manga_sign.outputs.signedReleaseFile0 }}" \
            "${{ steps.manga_sign.outputs.signedReleaseFile1 }}" \
            "${{ steps.manga_sign.outputs.signedReleaseFile2 }}" \
            "${{ steps.manga_sign.outputs.signedReleaseFile3 }}"; do
            [ -n "$f" ] && cp "$f" signed-apks/full/
          done
          for f in \
            "${{ steps.manga_sign_no_firebase.outputs.signedReleaseFile0 }}" \
            "${{ steps.manga_sign_no_firebase.outputs.signedReleaseFile1 }}" \
            "${{ steps.manga_sign_no_firebase.outputs.signedReleaseFile2 }}" \
            "${{ steps.manga_sign_no_firebase.outputs.signedReleaseFile3 }}"; do
            [ -n "$f" ] && cp "$f" signed-apks/noFirebase/
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Manga App
          path: signed-apks/full/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Manga No Firebase App
          path: signed-apks/noFirebase/*.apk
