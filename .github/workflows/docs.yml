# Builds the docs site with Zensical and publishes it to GitHub Pages.
# One-time setup: repo Settings › Pages › Source: GitHub Actions.
name: Docs

on:
  push:
    branches:
      - develop
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "TELEMETRY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical==0.1.4
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
