name: Baseline Profiles & Macrobenchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths:
      - 'animeworld/**'
      - 'mangaworld/**'
      - 'novelworld/**'
      - 'kmpuiviews/**'
      - 'UIViews/**'
      - 'AnimeWorldbaselineprofile/**'
      - 'MangaWorldbaselineprofile/**'
      - 'NovelWorldbaselineprofile/**'

# Cancel in-progress runs on the same branch — profile generation is slow
concurrency:
  group: baseline-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-baseline-profiles:
    name: Generate Baseline Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: 17

      - name: Set Java Options
        run: echo "JAVA_OPTS=-Xmx8g" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Required for hardware-accelerated emulator on GitHub-hosted runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Generate profiles for all three apps in one emulator session.
      # useConnectedDevices = true in BenchmarkPlugin — the emulator runner provides the device.
      # noFirebase flavor: no google-services.json needed; CI sets no applicationIdSuffix.
      - name: Generate Baseline Profiles (MangaWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :mangaworld:generateNoFirebaseReleaseBaselineProfile

      - name: Generate Baseline Profiles (AnimeWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :animeworld:generateNoFirebaseReleaseBaselineProfile

      - name: Generate Baseline Profiles (NovelWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :novelworld:generateNoFirebaseReleaseBaselineProfile

      # Commit generated baseline-prof.txt files back to the branch.
      # The plugin writes to: <app>/src/release/generated/baselineProfiles/baseline-prof.txt
      - name: Commit generated profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            mangaworld/src/*/generated/baselineProfiles/ \
            animeworld/src/*/generated/baselineProfiles/ \
            novelworld/src/*/generated/baselineProfiles/
          if git diff --staged --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore(perf): regenerate baseline profiles [skip ci]"
            git push
          fi

      - name: Upload generated profiles as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profiles
          path: |
            mangaworld/src/*/generated/baselineProfiles/
            animeworld/src/*/generated/baselineProfiles/
            novelworld/src/*/generated/baselineProfiles/
          retention-days: 30

  macrobenchmarks:
    name: Macrobenchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Run after profiles are generated so we measure the freshly-committed profile
    needs: generate-baseline-profiles

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: 17

      - name: Set Java Options
        run: echo "JAVA_OPTS=-Xmx8g" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Macrobenchmarks (MangaWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            ./gradlew :MangaWorldbaselineprofile:connectedNoFirebaseReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      - name: Run Macrobenchmarks (AnimeWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            ./gradlew :AnimeWorldbaselineprofile:connectedNoFirebaseReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      - name: Run Macrobenchmarks (NovelWorld)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >
            ./gradlew :NovelWorldbaselineprofile:connectedNoFirebaseReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark

      # Results JSON land here; upload even on failure to preserve regression data
      - name: Upload MangaWorld benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-mangaworld
          path: MangaWorldbaselineprofile/build/outputs/connected_android_test_additional_output/
          retention-days: 90

      - name: Upload AnimeWorld benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-animeworld
          path: AnimeWorldbaselineprofile/build/outputs/connected_android_test_additional_output/
          retention-days: 90

      - name: Upload NovelWorld benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-novelworld
          path: NovelWorldbaselineprofile/build/outputs/connected_android_test_additional_output/
          retention-days: 90
