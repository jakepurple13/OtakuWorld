syntax = "proto3";

package com.programmersbox.datastore.mangasettings;

message MangaSettings {
  // 3 was useNewReader (legacy reader removed).
  reserved 3;
  int32 pagePadding = 4;
  ReaderType readerType = 5;
  ImageLoaderType imageLoaderType = 6;
  bool useFlipPager = 7;
  bool allowUserDrawerGesture = 8;
  bool useFloatingReaderBottomBar = 9;
  bool hasMigrated = 10;
  bool includeInsetsForReader = 11;
  // Fraction of the screen width the reader pages use on expanded windows. 0 = full width.
  float readerWidthFraction = 12;
  PageIndicatorStyle pageIndicatorStyle = 13;
  // Inverted so the proto3 default (false) keeps the Pages item in the floating bar.
  bool hidePageNumberInBar = 14;
}

enum ImageLoaderType {
  Kamel = 0;
  Glide = 1;
  // 2 was Coil (removed); Wire decodes stored 2 as the default, Kamel.
  reserved 2;
  Panpf = 3;
  Telephoto = 4;
}

enum ReaderType {
  List = 0;
  Pager = 1;
  FlipPager = 2;
  CurlPager = 3;
}

// How the reader shows the current page. The top progress line shows for every style; Segments draws it split per page.
enum PageIndicatorStyle {
  Classic = 0;
  Pill = 1;
  Scrubber = 2;
  Rail = 3;
  Segments = 4;
  Folio = 5;
  Morph = 6;
  LineOnly = 7;
}
