syntax = "proto3";

package com.programmersbox.datastore.mangasettings;

message MangaSettings {
  // 3 was useNewReader (legacy reader removed).
  reserved 3;
  int32 pagePadding = 4;
  ReaderType readerType = 5;
  ImageLoaderType imageLoaderType = 6;
  bool useFlipPager = 7;
  bool allowUserDrawerGesture = 8;
  bool useFloatingReaderBottomBar = 9;
  bool hasMigrated = 10;
  bool includeInsetsForReader = 11;
}

enum ImageLoaderType {
  Kamel = 0;
  Glide = 1;
  // 2 was Coil (removed); Wire decodes stored 2 as the default, Kamel.
  reserved 2;
  Panpf = 3;
  Telephoto = 4;
}

enum ReaderType {
  List = 0;
  Pager = 1;
  FlipPager = 2;
  CurlPager = 3;
}